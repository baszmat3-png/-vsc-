<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>دليل الأرقام</title>
<style>
:root{--a:#14b8a6;--bg:#f3f5f9;--c:#fff;--t:#0f172a;--m:#64748b;--l:#e2e8f0;--sh:0 4px 20px rgba(15,23,42,.06);--wa:#22c55e}
[data-th=dark]{--bg:#0b1020;--c:#141b2f;--t:#e8ecf6;--m:#8d99b3;--l:#232c45;--sh:0 4px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 "Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:calc(15px*var(--fs,1))}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select{font:inherit;color:inherit}
.hero{background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 45%,#312e81));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:900px;margin:auto}
h1{margin:0;font-size:22px}.sub{opacity:.85;font-size:13px;margin-top:2px}
.hb{display:flex;gap:8px}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.sw{max-width:900px;margin:-44px auto 0;padding:0 14px;position:sticky;top:8px;z-index:9}
.sb{display:flex;align-items:center;gap:10px;background:var(--c);border-radius:16px;padding:0 14px;box-shadow:var(--sh);border:1px solid var(--l)}
.sb input{flex:1;border:0;background:none;padding:14px 0;outline:0;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--l);background:var(--c);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;white-space:nowrap;box-shadow:var(--sh)}
.chip b{color:var(--m);margin-inline-start:6px;font-weight:500}.chip.on{background:var(--a);border-color:var(--a);color:#fff}.chip.on b{color:#fff}
main{max-width:900px;margin:auto;padding:4px 14px 110px}
.bn{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fef3c7;color:#78350f;border-radius:14px;padding:10px 14px;margin:6px 0;font-size:14px}
.bn button{background:#f59e0b;border:0;color:#fff;border-radius:10px;padding:7px 14px;font-weight:700;cursor:pointer}
h2{font-size:14px;margin:22px 4px 10px;display:flex;align-items:center;gap:8px;color:var(--m)}h2 i{flex:1;height:1px;background:var(--l)}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr))}
.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.cp .card{padding:9px 12px}
.r1{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:none}
.nm{font-weight:700;line-height:1.35}.tt{color:var(--m);font-size:13px;margin-top:2px}.tag{display:inline-block;font-size:11px;background:var(--bg);color:var(--m);border-radius:8px;padding:1px 8px;margin:4px 0 0 4px}
.r2{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.num{direction:ltr;unicode-bidi:embed;text-align:right;white-space:nowrap;font-size:1.12em;font-weight:700;letter-spacing:.4px;font-variant-numeric:tabular-nums;color:var(--a)}
.ac{display:flex;gap:6px}.ac .b{flex:1;justify-content:center}.ac .b.s{flex:0 0 42px}
.b{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--l);background:var(--bg);text-decoration:none;color:var(--t);cursor:pointer;font-weight:600;font-size:13px}
.b.wa{background:var(--wa);border-color:var(--wa);color:#fff}.b.s{width:38px;padding:0;justify-content:center}
.fab{position:fixed;inset-inline-start:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;border:0;background:var(--a);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3);display:grid;place-items:center;cursor:pointer;z-index:20}.fab svg{width:26px;height:26px}
.ov{position:fixed;inset:0;background:rgba(2,6,23,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(3px)}.ov.on{display:flex}
.sh{background:var(--c);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){.ov{align-items:center}.sh{border-radius:24px}}
.sh h3{margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
label{display:block;font-size:13px;color:var(--m);margin:12px 0 5px}
.f{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--l);background:var(--bg);outline:0;font-size:16px}.f:focus{border-color:var(--a)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:70px;padding:10px;border-radius:12px;border:1px solid var(--l);background:var(--bg);cursor:pointer}.seg button.on{background:var(--a);border-color:var(--a);color:#fff}
.sw2{display:flex;gap:10px}.sw2 button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw2 button.on{border-color:var(--t)}
.pr{background:var(--a);color:#fff;border:0;border-radius:14px;padding:13px;width:100%;font-weight:700;margin-top:14px;cursor:pointer}.pr:disabled{opacity:.6}
.dg{background:transparent;color:#ef4444;border:1px solid #ef4444}
.sec{margin:16px 0 0;padding-top:4px;border-top:1px solid var(--l)}
.ur{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:12px;margin-bottom:8px}
.chks{max-height:210px;overflow:auto;background:var(--bg);border-radius:12px;padding:4px 12px}
label.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--t);margin:0;padding:8px 0}
label.chk input{width:18px;height:18px;accent-color:var(--a)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:99;pointer-events:none;font-size:14px;max-width:90vw;text-align:center}.toast.on{opacity:1}
.emp{text-align:center;color:var(--m);padding:60px 0}
#lg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--bg),color-mix(in srgb,var(--a) 22%,var(--bg)))}
.lc{width:100%;max-width:380px;background:var(--c);border:1px solid var(--l);border-radius:24px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.18);text-align:center}
.lc h1{font-size:22px}.lc .lo{font-size:44px}.lc p{color:var(--m);margin:4px 0 8px}.lc label{text-align:right}
.er{color:#ef4444;font-size:13px;min-height:20px;margin-top:10px}
</style></head><body>
<div id="lg" hidden><div class="lc"><div class="lo">🔐</div><h1>دليل الأرقام</h1><p>سجّل الدخول للمتابعة</p>
<label>اسم المستخدم</label><input class="f" id="lu" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false">
<label>كلمة المرور</label><input class="f" id="lp" type="password" dir="ltr" autocomplete="off">
<label>الرمز</label><input class="f" id="lk" type="password" dir="ltr" autocomplete="off">
<label class="chk" style="justify-content:center;margin-top:12px"><input type="checkbox" id="lr" checked> تذكّرني على هذا الجهاز (365 يومًا)</label><div class="er" id="le"></div><button class="pr" id="go">دخول</button></div></div>
<div id="app" hidden>
<div class="hero"><div class="top"><div><h1>دليل الأرقام</h1><div class="sub" id="st"></div></div><div class="hb"><button class="ib" id="gear" aria-label="الإعدادات"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button><button class="ib" id="out" aria-label="خروج"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button></div></div></div>
<div class="sw"><div class="sb"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input id="q" type="search" placeholder="ابحث بالاسم أو المنصب أو الرقم..." autocomplete="off"></div><div class="chips" id="chips"></div></div>
<main><div class="bn" id="bn" hidden><span>⚠️ لديك تعديلات غير منشورة</span><button id="bp">نشر الآن</button></div><div id="list"></div></main>

const enc8=new TextEncoder(),dec8=new TextDecoder();

const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function dec(key,v){return JSON.parse(dec8.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(v.i)},await ik(key),ub64(v.c))))}
