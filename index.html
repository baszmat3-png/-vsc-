<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>دليل الأرقام</title>
<style>
:root{--a:#14b8a6;--bg:#f3f5f9;--c:#fff;--t:#0f172a;--m:#64748b;--l:#e2e8f0;--sh:0 4px 20px rgba(15,23,42,.06);--wa:#22c55e}
[data-th=dark]{--bg:#0b1020;--c:#141b2f;--t:#e8ecf6;--m:#8d99b3;--l:#232c45;--sh:0 4px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 "Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:calc(15px*var(--fs,1))}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select{font:inherit;color:inherit}
.hero{background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 45%,#312e81));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:900px;margin:auto}
h1{margin:0;font-size:22px}.sub{opacity:.85;font-size:13px;margin-top:2px}
.hb{display:flex;gap:8px}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.sw{max-width:900px;margin:-44px auto 0;padding:0 14px;position:sticky;top:8px;z-index:9}
.sb{display:flex;align-items:center;gap:10px;background:var(--c);border-radius:16px;padding:0 14px;box-shadow:var(--sh);border:1px solid var(--l)}
.sb input{flex:1;border:0;background:none;padding:14px 0;outline:0;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--l);background:var(--c);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;white-space:nowrap;box-shadow:var(--sh)}
.chip b{color:var(--m);margin-inline-start:6px;font-weight:500}.chip.on{background:var(--a);border-color:var(--a);color:#fff}.chip.on b{color:#fff}
main{max-width:900px;margin:auto;padding:4px 14px 110px}
.bn{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fef3c7;color:#78350f;border-radius:14px;padding:10px 14px;margin:6px 0;font-size:14px}
.bn button{background:#f59e0b;border:0;color:#fff;border-radius:10px;padding:7px 14px;font-weight:700;cursor:pointer}
h2{font-size:14px;margin:22px 4px 10px;display:flex;align-items:center;gap:8px;color:var(--m)}h2 i{flex:1;height:1px;background:var(--l)}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr))}
.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.cp .card{padding:9px 12px}
.r1{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:none}
.nm{font-weight:700;line-height:1.35}.tt{color:var(--m);font-size:13px;margin-top:2px}.tag{display:inline-block;font-size:11px;background:var(--bg);color:var(--m);border-radius:8px;padding:1px 8px;margin:4px 0 0 4px}
.r2{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.num{direction:ltr;unicode-bidi:embed;text-align:right;white-space:nowrap;font-size:1.12em;font-weight:700;letter-spacing:.4px;font-variant-numeric:tabular-nums;color:var(--a)}
.ac{display:flex;gap:6px}.ac .b{flex:1;justify-content:center}.ac .b.s{flex:0 0 42px}
.b{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--l);background:var(--bg);text-decoration:none;color:var(--t);cursor:pointer;font-weight:600;font-size:13px}
.b.wa{background:var(--wa);border-color:var(--wa);color:#fff}.b.s{width:38px;padding:0;justify-content:center}
.fab{position:fixed;inset-inline-start:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;border:0;background:var(--a);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3);display:grid;place-items:center;cursor:pointer;z-index:20}.fab svg{width:26px;height:26px}
.ov{position:fixed;inset:0;background:rgba(2,6,23,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(3px)}.ov.on{display:flex}
.sh{background:var(--c);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){.ov{align-items:center}.sh{border-radius:24px}}
.sh h3{margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
label{display:block;font-size:13px;color:var(--m);margin:12px 0 5px}
.f{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--l);background:var(--bg);outline:0;font-size:16px}.f:focus{border-color:var(--a)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:70px;padding:10px;border-radius:12px;border:1px solid var(--l);background:var(--bg);cursor:pointer}.seg button.on{background:var(--a);border-color:var(--a);color:#fff}
.sw2{display:flex;gap:10px}.sw2 button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw2 button.on{border-color:var(--t)}
.pr{background:var(--a);color:#fff;border:0;border-radius:14px;padding:13px;width:100%;font-weight:700;margin-top:14px;cursor:pointer}.pr:disabled{opacity:.6}
.dg{background:transparent;color:#ef4444;border:1px solid #ef4444}
.sec{margin:16px 0 0;padding-top:4px;border-top:1px solid var(--l)}
.ur{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:12px;margin-bottom:8px}
.chks{max-height:210px;overflow:auto;background:var(--bg);border-radius:12px;padding:4px 12px}
label.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--t);margin:0;padding:8px 0}
label.chk input{width:18px;height:18px;accent-color:var(--a)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:99;pointer-events:none;font-size:14px;max-width:90vw;text-align:center}.toast.on{opacity:1}
.emp{text-align:center;color:var(--m);padding:60px 0}
#lg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--bg),color-mix(in srgb,var(--a) 22%,var(--bg)))}
.lc{width:100%;max-width:380px;background:var(--c);border:1px solid var(--l);border-radius:24px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.18);text-align:center}
.lc h1{font-size:22px}.lc .lo{font-size:44px}.lc p{color:var(--m);margin:4px 0 8px}.lc label{text-align:right}
.er{color:#ef4444;font-size:13px;min-height:20px;margin-top:10px}
</style></head><body>

<label>كلمة المرور</label><input class="f" id="lp" type="password" dir="ltr" autocomplete="off">
<label>الرمز</label><input class="f" id="lk" type="password" dir="ltr" autocomplete="off">
<div class="er" id="le"></div><button class="pr" id="go">دخول</button></div></div>

<div class="sw"><div class="sb"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input id="q" type="search" placeholder="ابحث بالاسم أو المنصب أو الرقم..." autocomplete="off"></div><div class="chips" id="chips"></div></div>

function card(c,tag){const col=ACC[(cats().indexOf(c.c)+1)%ACC.length],w=wl(c.w);
 return`<div class="card"><div class="r1"><div class="av" style="background:${col}">${esc(ini(c.n))}</div><div style="min-width:0"><div class="nm">${esc(c.n)}</div>${c.t?`<div class="tt">${esc(c.t)}</div>`:''}${tag?`<span class="tag">${EM[c.c]||'📁'} ${esc(c.c)}</span>`:''}${ADMIN&&c.h?'<span class="tag">🔒 مخفي عن المستخدمين</span>':''}</div></div>
<div class="r2"><div class="num">${esc(c.p)}</div><div class="ac">${w?`<a class="b wa" href="${esc(w)}" ${S.wm=='web'?'target="_blank" rel="noopener"':''}>${ic('wa')}واتساب</a>`:''}<a class="b" href="tel:${esc((c.w||c.p).replace(/[^\d+]/g,''))}">${ic('ph')}اتصال</a><button class="b s" data-cp="${c.i}">${ic('cp')}</button>${ADMIN?`<button class="b s" data-ed="${c.i}">${ic('ed')}</button>`:''}</div></div></div>`}
function render(){const t=norm($('q').value.trim()),tn=t.replace(/\s/g,'');
 let r=C.filter(c=>(act=='الكل'||c.c==act)&&(!t||norm(c.n+' '+c.t+' '+c.c).includes(t)||c.p.replace(/\s/g,'').includes(tn)));
 if(S.so=='a')r=[...r].sort((a,b)=>a.n.localeCompare(b.n,'ar'));
 let h='';if(!r.length)h='<div class="emp">لا توجد نتائج</div>';
 else if(S.gp){for(const k of cats()){const g=r.filter(c=>c.c==k);if(g.length)h+=`<h2>${EM[k]||'📁'} ${esc(k)}${ADMIN&&ST.hc.includes(k)?' 🔒':''} <span>${g.length}</span><i></i></h2><div class="g">${g.map(c=>card(c)).join('')}</div>`}}
 else h=`<div class="g">${r.map(c=>card(c,1)).join('')}</div>`;
 $('list').innerHTML=h;
 $('list').querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{const c=C.find(x=>x.i==b.dataset.cp);(navigator.clipboard?navigator.clipboard.writeText(c.p):Promise.reject()).then(()=>toast('تم نسخ الرقم'),()=>toast(c.p))});
 $('list').querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>form(C.find(x=>x.i==b.dataset.ed)));bn()}
const openSh=h=>{$('sh').innerHTML=h;$('ov').classList.add('on')},closeSh=()=>$('ov').classList.remove('on');
$('ov').onclick=e=>{if(e.target==$('ov'))closeSh()};
const X=`<button class="b s" onclick="closeSh()">${ic('x')}</button>`;
function form(c){const e=!!c;c=c||{n:'',t:'',p:'',c:'',h:0};
 openSh(`<h3>${e?'تعديل جهة اتصال':'إضافة شخص'}${X}</h3>
<label>الاسم</label><input class="f" id="fn" value="${esc(c.n)}" placeholder="مثال: أحمد علي">
<label>المنصب أو مكان العمل</label><input class="f" id="ft" value="${esc(c.t)}" placeholder="مثال: مدير مكتب — وزارة الداخلية">
<label>رقم الهاتف</label><input class="f" id="fp" dir="ltr" inputmode="tel" value="${esc(c.p)}" placeholder="07XX XXX XXXX أو +964...">
<label>التصنيف</label><select class="f" id="fc"><option value="">تلقائي (حسب المنصب)</option>${cats().map(k=>`<option ${k==c.c?'selected':''}>${esc(k)}</option>`).join('')}<option value="+">＋ تصنيف جديد…</option></select>
<input class="f" id="fx" placeholder="اسم التصنيف الجديد" style="display:none;margin-top:8px">
<label class="chk"><input type="checkbox" id="fh" ${c.h?'checked':''}> 🔒 إخفاء هذا الرقم عن جميع المستخدمين</label>
<button class="pr" id="sv">${e?'حفظ التعديلات':'إضافة'}</button>${e?'<button class="pr dg" id="dl">حذف</button>':''}`);
 $('fc').onchange=()=>$('fx').style.display=$('fc').value=='+'?'block':'none';
 $('sv').onclick=async()=>{const n=$('fn').value.trim(),t=$('ft').value.trim(),f=fmt($('fp').value);if(!n&&!t)return toast('اكتب الاسم');if(!f)return toast('رقم الهاتف غير صحيح');
  let k=$('fc').value;if(k=='+')k=$('fx').value.trim();if(!k)k=auto(n+' '+t);const h=$('fh').checked?1:0;
  if(e)Object.assign(c,{n,t,p:f.p,w:f.w,c:k,h});else{C.unshift({i:C.length+1+Math.floor(Math.random()*1e6),n,t,p:f.p,w:f.w,c:k,h})}
  await touch();closeSh();buildChips();render();toast(e?'تم الحفظ':'تمت الإضافة')};
 if(e)$('dl').onclick=async()=>{if($('dl').dataset.s){C.splice(C.indexOf(c),1);await touch();closeSh();buildChips();render();toast('تم الحذف')}else{$('dl').dataset.s=1;$('dl').textContent='اضغط مرة أخرى للتأكيد'}}}
const seg=(k,o)=>`<div class="seg">${o.map(([v,l])=>`<button data-k="${k}" data-v="${v}" class="${S[k]==v?'on':''}">${l}</button>`).join('')}</div>`;
function settings(){openSh(`<h3>الإعدادات${X}</h3>
${ADMIN?`<button class="pr" id="ac" style="margin-top:0">👥 المستخدمون والخصوصية</button><button class="pr" id="pb">🚀 نشر نسخة محدثة${dirty?' ●':''}</button><div class="sec"></div>`:`<div class="tt">مسجّل الدخول: ${esc(ST.name||'')}</div>`}
<label>المظهر</label>${seg('th',[['auto','تلقائي'],['light','فاتح'],['dark','داكن']])}
<label>لون التطبيق</label><div class="sw2">${ACC.map((a,i)=>`<button data-k="ac" data-v="${i}" class="${S.ac==i?'on':''}" style="background:${a}"></button>`).join('')}</div>
<label>حجم الخط</label>${seg('fs',[[0.9,'صغير'],[1,'متوسط'],[1.12,'كبير']])}
<label>كثافة البطاقات</label>${seg('dn',[['','مريح'],['cp','مضغوط']])}
<label>الترتيب</label>${seg('so',[['o','الأصلي'],['a','أبجدي']])}
<label>التجميع حسب التصنيف</label>${seg('gp',[[1,'مفعّل'],[0,'معطّل']])}
<label>القفل التلقائي عند الخمول</label>${seg('lock',[[0,'مطفأ'],[5,'5 د'],[15,'15 د'],[60,'ساعة']])}
<label>طريقة فتح واتساب</label>${seg('wm',[['app','مباشر (التطبيق)'],['web','رابط wa.me']])}
<label>رسالة واتساب الجاهزة (اختياري)</label><input class="f" id="sm" value="${esc(S.msg)}" placeholder="السلام عليكم…">
${ADMIN?`<button class="pr" id="ex" style="background:var(--bg);color:var(--t);border:1px solid var(--l)">تصدير جهات الاتصال (JSON)</button>`:''}
<button class="pr dg" id="lo">تسجيل الخروج</button>`);
 $('sh').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const v=b.dataset.v;S[b.dataset.k]=isNaN(+v)||v===''?v:+v;saveS();theme();settings();render();bump()});
 $('sm').oninput=e=>{S.msg=e.target.value;saveS();render()};$('lo').onclick=logout;
 if(ADMIN){$('ac').onclick=access;$('pb').onclick=publish;$('ex').onclick=()=>dl(JSON.stringify(C.map(({n,t,p,w,c,h})=>({n,t,p,w,c,h})),null,1),'contacts.json','application/json')}}
function dl(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.append(a);a.click();a.remove()}
function access(){const us=ST.users;
 openSh(`<h3>المستخدمون والخصوصية${X}</h3>
<label>المستخدمون (${us.length})</label>
${us.map((u,i)=>`<div class="ur"><div><b>${esc(u.name)}</b><div class="tt">@${esc(u.u)} · ${u.hc.length?u.hc.length+' تصنيف مخفي':'بدون تقييد إضافي'}</div></div><button class="b" data-u="${i}">تعديل</button></div>`).join('')||'<div class="tt">لا يوجد مستخدمون بعد.</div>'}
<button class="pr" id="nu">＋ إضافة مستخدم</button>
<div class="sec"></div><label>تصنيفات مخفية عن جميع المستخدمين</label>
<div class="chks">${cats().map(k=>`<label class="chk"><input type="checkbox" data-hc="${esc(k)}" ${ST.hc.includes(k)?'checked':''}> ${EM[k]||'📁'} ${esc(k)}</label>`).join('')}</div>
<div class="tt" style="margin-top:6px">لإخفاء رقم محدد: افتح تعديله واختر «إخفاء عن جميع المستخدمين».</div>
<div class="sec"></div><label>حساب المدير</label><button class="b" id="am" style="width:100%;justify-content:center">تغيير اسم المستخدم / كلمة المرور / الرمز</button>
<button class="pr" id="pb2">🚀 نشر نسخة محدثة${dirty?' ●':''}</button><button class="b" id="bk" style="width:100%;justify-content:center;margin-top:10px">رجوع</button>`);
 $('sh').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>userForm(+b.dataset.u));
 $('sh').querySelectorAll('[data-hc]').forEach(b=>b.onchange=async()=>{const k=b.dataset.hc;ST.hc=ST.hc.filter(x=>x!=k);if(b.checked)ST.hc.push(k);await touch();render()});
 $('nu').onclick=()=>userForm(-1);$('am').onclick=adminForm;$('pb2').onclick=publish;$('bk').onclick=settings}
const hcBoxes=h=>`<div class="chks">${cats().map(k=>`<label class="chk"><input type="checkbox" data-k2="${esc(k)}" ${h.includes(k)?'checked':''}> ${EM[k]||'📁'} ${esc(k)}</label>`).join('')}</div>`;
function userForm(i){const nw=i<0,u=nw?{name:'',u:'',hc:[]}:ST.users[i];
 openSh(`<h3>${nw?'إضافة مستخدم':'تعديل المستخدم'}${X}</h3>
<label>الاسم الظاهر</label><input class="f" id="un" value="${esc(u.name)}">
<label>اسم المستخدم (للدخول)</label><input class="f" id="uu" dir="ltr" autocapitalize="off" ${nw?'':'readonly'} value="${esc(u.u)}" placeholder="حروف إنجليزية وأرقام">
<label>كلمة المرور ${nw?'':'(اتركها فارغة للإبقاء)'}</label><input class="f" id="up" dir="ltr" autocomplete="off" placeholder="8 أحرف على الأقل">
<label>الرمز ${nw?'':'(اتركه فارغًا للإبقاء)'}</label><input class="f" id="uc" dir="ltr" autocomplete="off" placeholder="4 خانات على الأقل">
<label>التصنيفات المخفية عن هذا المستخدم</label>${hcBoxes(u.hc)}
<button class="pr" id="us">حفظ</button>${nw?'':'<button class="pr dg" id="ud">حذف المستخدم</button>'}<button class="b" id="bk" style="width:100%;justify-content:center;margin-top:10px">رجوع</button>`);
 $('bk').onclick=access;
 $('us').onclick=async()=>{const name=$('un').value.trim(),un=$('uu').value.trim().toLowerCase(),p=$('up').value,c=$('uc').value;
  if(!name)return toast('اكتب الاسم');
  if(nw){if(!/^[a-z0-9._-]{3,}$/.test(un))return toast('اسم المستخدم: 3 أحرف على الأقل (إنجليزي/أرقام)');if(un==ST.admin.u.toLowerCase()||ST.users.some(x=>x.u==un))return toast('اسم المستخدم مستخدم مسبقًا')}
  if((nw||p||c)&&(p.length<8||c.length<4))return toast('كلمة المرور 8 أحرف والرمز 4 خانات على الأقل');
  const hc=[...$('sh').querySelectorAll('[data-k2]')].filter(x=>x.checked).map(x=>x.dataset.k2);
  const b=$('us');b.disabled=true;b.textContent='جارٍ الحفظ…';
  if(nw){const salt=rnd(16);ST.users.push({name,u:un,salt,key:await derive(un,p,c,salt),hc})}
  else{Object.assign(u,{name,hc});if(p){u.salt=rnd(16);u.key=await derive(u.u,p,c,u.salt)}}
  await touch();toast('تم الحفظ — انشر النسخة ليصل التغيير للمستخدمين');access()};
 if(!nw)$('ud').onclick=async()=>{if($('ud').dataset.s){ST.users.splice(i,1);await touch();access()}else{$('ud').dataset.s=1;$('ud').textContent='اضغط مرة أخرى للتأكيد'}}}
function adminForm(){openSh(`<h3>حساب المدير${X}</h3>
<label>اسم المستخدم</label><input class="f" id="au" dir="ltr" autocapitalize="off" value="${esc(ST.admin.u)}">
<label>كلمة المرور الجديدة</label><input class="f" id="ap" dir="ltr" autocomplete="off" placeholder="8 أحرف على الأقل">
<label>الرمز الجديد</label><input class="f" id="ak" dir="ltr" autocomplete="off" placeholder="4 خانات على الأقل">
<div class="tt" style="margin-top:8px">يسري التغيير بعد «نشر نسخة محدثة»، ثم ادخل بالبيانات الجديدة. احفظها جيدًا: لا يمكن استرجاعها.</div>
<button class="pr" id="as">حفظ</button><button class="b" id="bk" style="width:100%;justify-content:center;margin-top:10px">رجوع</button>`);
 $('bk').onclick=access;
 $('as').onclick=async()=>{const un=$('au').value.trim().toLowerCase(),p=$('ap').value,k=$('ak').value;
  if(!/^[a-z0-9._-]{3,}$/.test(un))return toast('اسم المستخدم غير صالح');if(ST.users.some(x=>x.u==un))return toast('اسم المستخدم مستخدم مسبقًا');
  if(p.length<8||k.length<4)return toast('كلمة المرور 8 أحرف والرمز 4 خانات على الأقل');
  const b=$('as');b.disabled=true;b.textContent='جارٍ الحفظ…';const salt=rnd(16);
  ST.admin={u:un,salt,key:await derive(un,p,k,salt)};await touch();toast('تم الحفظ — انشر النسخة لتفعيله');access()}}
async function publish(){toast('جارٍ التشفير…');ST.v=(ST.v||1)+1;ST.contacts=C;
 const vaults={},adm={...ST};delete adm._dirty;adm.contacts=C.map(({n,t,p,w,c,h})=>({n,t,p,w,c,h:h?1:0}));
 vaults[await uidOf(ST.admin.u)]=await enc(ST.admin.key,adm,ST.admin.salt);
 for(const u of ST.users){const view={role:'user',name:u.name,v:ST.v,ord:ST.ord,contacts:C.filter(c=>!c.h&&!ST.hc.includes(c.c)&&!u.hc.includes(c.c)).map(({n,t,p,w,c})=>({n,t,p,w,c}))};vaults[await uidOf(u.u)]=await enc(u.key,view,u.salt)}
 const re=new RegExp('(<scr'+'ipt id="vaults"[^>]*>)[\\s\\S]*?(</scr'+'ipt>)');
 const html=SRC.replace(re,(m,a,b)=>a+JSON.stringify({it:V.it,vaults})+b);
 dl(html,'index.html','text/html');dirty=false;await touch();dirty=false;delete ST._dirty;bn();
 try{localStorage.setItem('pb_d_'+UID,JSON.stringify(await enc(KEY,ST,'')))}catch(e){}
 openSh(`<h3>تم إنشاء النسخة${X}</h3><p>نزّل الملف <b>index.html</b> الآن، وارفعه على Render ليحلّ محل النسخة الحالية. بعد الرفع يرى كل مستخدم ما يخصه فقط، ويحتاج اسم المستخدم وكلمة المرور والرمز.</p><button class="pr" onclick="closeSh()">تم</button>`)}
async function start(st,key,id){ST=st;KEY=key;UID=id;ADMIN=st.role=='admin';
 if(ADMIN){try{const d=localStorage.getItem('pb_d_'+id);if(d){const o=await dec(key,JSON.parse(d));if(o.v>=ST.v)ST=o}}catch(e){}ST.users=ST.users||[];ST.hc=ST.hc||[]}
 dirty=!!ST._dirty;C=ST.contacts;C.forEach((c,i)=>c.i=i+1);
 try{Object.assign(S,JSON.parse(localStorage.getItem('pb_s')||'{}'))}catch(e){}
 $('lg').hidden=true;$('app').hidden=false;$('add').hidden=!ADMIN;theme();buildChips();render();bump();
 $('gear').onclick=settings;$('out').onclick=logout;$('add').onclick=()=>form();$('q').oninput=render;$('bp').onclick=publish;
 ['click','keydown','touchstart','scroll'].forEach(e=>addEventListener(e,bump,{passive:true}))}
const FK='pb_f';
function lockLeft(){try{const f=JSON.parse(localStorage.getItem(FK)||'{}');if((f.n||0)>=5){const w=Math.min(900,30*2**(f.n-5))*1000-(Date.now()-f.t);return w>0?Math.ceil(w/1000):0}}catch(e){}return 0}
async function doLogin(){const u=$('lu').value,p=$('lp').value,k=$('lk').value,er=$('le'),b=$('go');er.textContent='';
 const w=lockLeft();if(w){er.textContent='محاولات كثيرة. انتظر '+w+' ثانية.';return}
 if(!u||!p||!k){er.textContent='أدخل اسم المستخدم وكلمة المرور والرمز';return}
 b.disabled=true;b.textContent='جارٍ التحقق…';
 try{const id=await uidOf(u),v=V.vaults[id],key=await derive(u,p,k,v?v.s:rnd(16));let st=null;
  if(v){try{st=await dec(key,v)}catch(e){}}
  if(!st){try{const f=JSON.parse(localStorage.getItem(FK)||'{}');localStorage.setItem(FK,JSON.stringify({n:(f.n||0)+1,t:Date.now()}))}catch(e){}er.textContent='بيانات الدخول غير صحيحة';return}
  try{localStorage.removeItem(FK);sessionStorage.setItem('pb_ss',JSON.stringify({id,key}))}catch(e){}
  $('lp').value='';$('lk').value='';await start(st,key,id)}
 finally{b.disabled=false;b.textContent='دخول'}}
$('go').onclick=doLogin;['lu','lp','lk'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key=='Enter')doLogin()}));
(async()=>{theme();try{const s=JSON.parse(sessionStorage.getItem('pb_ss')||'null');if(s&&V.vaults[s.id]){return await start(await dec(s.key,V.vaults[s.id]),s.key,s.id)}}catch(e){}$('lg').hidden=false})();
</script></body></html>
