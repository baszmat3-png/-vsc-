const RK=['فريق','لواء','عميد','عقيد','مقدم','رائد','ركن','مفوض','نقيب'];
function auto(t){const n=' '+norm(t)+' ';for(const[c,k]of RULES){if(k.some(x=>n.includes(x)))return c;if(c.startsWith('الجيش')&&/(^| )(فق|ف|ل|لواء|فرقه|فوج)\s*\d|(^| )فق( |$)/.test(n))return c}
 return n.split(/\s+/).some(w=>RK.includes(w.replace(/^ال/,'')))?'ضباط وقادة (رتبة فقط)':'أخرى'}
function fmt(raw){let t=(raw||'').replace(/[\u200b-\u200f\u202a-\u202e]/g,'').trim();if(!t)return null;
 if(t.startsWith('+')&&!t.startsWith('+964')){const d=t.replace(/\D/g,'');return d.length<7?null:{p:t,w:'+'+d}}
 let d=t.replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('964'))d=d.slice(3);d=d.replace(/^0+/,'');
 if(d.length==10&&d[0]=='7')return{p:`0${d.slice(0,3)} ${d.slice(3,6)} ${d.slice(6)}`,w:'+964'+d};
 return d.length<7?null:{p:t,w:/^0/.test(t.replace(/\s/g,''))||!S.cc?'':'+'+S.cc+d}}
const cats=()=>{const e=[...new Set(C.map(c=>c.c))];return[...ORD.filter(c=>e.includes(c)),...e.filter(c=>!ORD.includes(c)).sort()]};
const EM={'المؤتمرات':'🎤','الرئاسات ومجلس الوزراء':'🏛️','القضاء والمحاماة':'⚖️','مكاتب وسكرتارية':'🗂️','وكلاء الوزارات':'🧑‍💼','الوزراء':'🎖️','المحافظون والحكومات المحلية':'🏙️','مجلس النواب والنواب':'🗳️','الإعلاميون والمحللون والفنانون':'🎙️','الأحزاب والحشد والفصائل':'🚩','الصحة والمستشفيات':'🩺','السفارات والدبلوماسيون':'🌐','الاستخبارات والأمن الوطني':'🛡️','الشرطة والداخلية والدفاع المدني':'🚓','الجيش ووزارة الدفاع والعمليات':'🪖','المدراء العامون والدوائر':'🏢','الهيئات والمؤسسات والبنوك':'🏦','الشيوخ والعشائر':'🤝'};
const toast=m=>{const t=$('ts');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)};
function wl(w){if(!w)return'';const m=S.msg.trim(),p=w.replace(/\D/g,'');return S.wm=='app'?`whatsapp://send?phone=${p}${m?'&text='+encodeURIComponent(m):''}`:`https://wa.me/${p}${m?'?text='+encodeURIComponent(m):''}`}
const TT=['الفريق','اللواء','العميد','العقيد','المقدم','الرائد','الركن','دكتور','الدكتور','الاستاذ','استاذ','الشيخ','السيد','المهندس','النائب','الحاج','د'];
const ini=n=>{const w=n.replace(/[()]/g,' ').split(/\s+/).filter(x=>x&&!TT.includes(x));return(w[0]||n||'?')[0]};
function dark(){return S.th=='dark'||(S.th=='auto'&&matchMedia('(prefers-color-scheme:dark)').matches)}
function theme(){document.documentElement.dataset.th=dark()?'dark':'light';document.documentElement.style.setProperty('--a',ACC[S.ac]);document.documentElement.style.setProperty('--fs',S.fs);document.body.className=S.dn}
function buildChips(){const k=cats();$('chips').innerHTML=[['الكل',C.length],...k.map(c=>[c,C.filter(x=>x.c==c).length])].map(([c,n])=>`<button class="chip ${c==act?'on':''}" data-c="${c}">${c}<b>${n}</b></button>`).join('');
 $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{act=b.dataset.c;buildChips();render();scrollTo({top:0})});$('st').textContent=C.length+' جهة اتصال · '+k.length+' تصنيف'}
function card(c,tag){const col=ACC[(cats().indexOf(c.c)+1)%ACC.length],w=wl(c.w);
 return`<div class="card"><div class="r1"><div class="av" style="background:${col}">${ini(c.n)}</div><div style="min-width:0"><div class="nm">${esc(c.n)}</div>${c.t?`<div class="tt">${esc(c.t)}</div>`:''}${tag?`<span class="tag">${EM[c.c]||'📁'} ${esc(c.c)}</span>`:''}</div></div>
<div class="r2"><div class="num">${esc(c.p)}</div><div class="ac">${w?`<a class="b wa" href="${w}" ${S.wm=='web'?'target="_blank" rel="noopener"':''}>${ic('wa')}واتساب</a>`:''}<a class="b" href="tel:${(c.w||c.p).replace(/[^\d+]/g,'')}">${ic('ph')}اتصال</a><button class="b s" data-cp="${c.i}">${ic('cp')}</button><button class="b s" data-ed="${c.i}">${ic('ed')}</button></div></div></div>`}
const esc=s=>(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function render(){const t=norm($('q').value.trim()),tn=t.replace(/\s/g,'');
 let r=C.filter(c=>(act=='الكل'||c.c==act)&&(!t||(norm(c.n+' '+c.t+' '+c.c)).includes(t)||c.p.replace(/\s/g,'').includes(tn)));
 if(S.so=='a')r=[...r].sort((a,b)=>a.n.localeCompare(b.n,'ar'));
 let h='';if(!r.length)h='<div class="emp">لا توجد نتائج</div>';
 else if(S.gp&&act=='الكل'||S.gp){for(const k of cats()){const g=r.filter(c=>c.c==k);if(g.length)h+=`<h2>${EM[k]||'📁'} ${esc(k)} <span>${g.length}</span><i></i></h2><div class="g">${g.map(c=>card(c)).join('')}</div>`}}
 else h=`<div class="g">${r.map(c=>card(c,1)).join('')}</div>`;
 $('list').innerHTML=h;$('list').querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{const c=C.find(x=>x.i==b.dataset.cp);(navigator.clipboard?navigator.clipboard.writeText(c.p):Promise.reject()).then(()=>toast('تم نسخ الرقم'),()=>toast(c.p))});
 $('list').querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>form(C.find(x=>x.i==b.dataset.ed)))}
const openSh=h=>{$('sh').innerHTML=h;$('ov').classList.add('on')},closeSh=()=>$('ov').classList.remove('on');
$('ov').onclick=e=>{if(e.target==$('ov'))closeSh()};
function form(c){const e=!!c;c=c||{n:'',t:'',p:'',c:''};
 openSh(`<h3>${e?'تعديل جهة اتصال':'إضافة شخص'}<button class="b s" onclick="closeSh()">${ic('x')}</button></h3>
<label>الاسم</label><input class="f" id="fn" value="${esc(c.n)}" placeholder="مثال: أحمد علي">
<label>المنصب أو مكان العمل</label><input class="f" id="ft" value="${esc(c.t)}" placeholder="مثال: مدير مكتب — وزارة الداخلية">
<label>رقم الهاتف</label><input class="f" id="fp" dir="ltr" inputmode="tel" value="${esc(c.p)}" placeholder="07XX XXX XXXX أو +964...">
<label>التصنيف</label><select class="f" id="fc"><option value="">تلقائي (حسب المنصب)</option>${cats().concat(ORD).filter((x,i,a)=>a.indexOf(x)==i).map(k=>`<option ${k==c.c?'selected':''}>${esc(k)}</option>`).join('')}<option value="+">＋ تصنيف جديد…</option></select>
<input class="f" id="fx" placeholder="اسم التصنيف الجديد" style="display:none;margin-top:8px">
<button class="pr" id="sv">${e?'حفظ التعديلات':'إضافة'}</button>${e?'<button class="pr dg" id="dl">حذف</button>':''}`);
 $('fc').onchange=()=>$('fx').style.display=$('fc').value=='+'?'block':'none';
 $('sv').onclick=()=>{const n=$('fn').value.trim(),t=$('ft').value.trim(),f=fmt($('fp').value);if(!n&&!t)return toast('اكتب الاسم');if(!f)return toast('رقم الهاتف غير صحيح');
  let k=$('fc').value;if(k=='+')k=$('fx').value.trim();if(!k)k=auto(n+' '+t);
  if(e){Object.assign(c,{n,t,p:f.p,w:f.w,c:k});if(!c.u)U.e[c.k]={n,t,p:f.p,w:f.w,c:k}}else C.unshift({i:++uid,u:1,n,t,p:f.p,w:f.w,c:k});
  save();closeSh();buildChips();render();toast(e?'تم الحفظ':'تمت الإضافة')};
 if(e)$('dl').onclick=()=>{if($('dl').dataset.s){if(!c.u)U.d.push(c.k);C=C.filter(x=>x!=c);save();closeSh();buildChips();render();toast('تم الحذف')}else{$('dl').dataset.s=1;$('dl').textContent='اضغط مرة أخرى للتأكيد'}}}
const seg=(k,o)=>`<div class="seg">${o.map(([v,l])=>`<button data-k="${k}" data-v="${v}" class="${S[k]==v?'on':''}">${l}</button>`).join('')}</div>`;
function settings(){openSh(`<h3>الإعدادات<button class="b s" onclick="closeSh()">${ic('x')}</button></h3>
<label>المظهر</label>${seg('th',[['auto','تلقائي'],['light','فاتح'],['dark','داكن']])}
<label>لون التطبيق</label><div class="sw2">${ACC.map((a,i)=>`<button data-k="ac" data-v="${i}" class="${S.ac==i?'on':''}" style="background:${a}"></button>`).join('')}</div>
<label>حجم الخط</label>${seg('fs',[[0.9,'صغير'],[1,'متوسط'],[1.12,'كبير']])}
<label>كثافة البطاقات</label>${seg('dn',[['','مريح'],['cp','مضغوط']])}
<label>الترتيب</label>${seg('so',[['o','الأصلي'],['a','أبجدي']])}
<label>التجميع حسب التصنيف</label>${seg('gp',[[1,'مفعّل'],[0,'معطّل']])}
<label>طريقة فتح واتساب</label>${seg('wm',[['app','مباشر (التطبيق)'],['web','رابط wa.me']])}
<label>رسالة واتساب الجاهزة (اختياري)</label><input class="f" id="sm" value="${esc(S.msg)}" placeholder="السلام عليكم…">
<label>مفتاح الدولة للأرقام بدون رمز</label><input class="f" id="sc" dir="ltr" value="${esc(S.cc)}">
<button class="pr" id="ex">تصدير نسخة احتياطية (JSON)</button><button class="pr dg" id="rs">استعادة البيانات الأصلية</button>
<p style="color:var(--m);font-size:12px;margin:12px 0 0">${ok?'التعديلات تُحفظ تلقائيًا على هذا الجهاز.':'⚠️ الحفظ غير متاح في هذا العارض. افتح الملف من المتصفح ليحفظ تعديلاتك.'}</p>`);
 $('sh').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let v=b.dataset.v;S[b.dataset.k]=isNaN(+v)||v===''?v:+v;save();theme();settings();render()});
 $('sm').oninput=e=>{S.msg=e.target.value;save();render()};$('sc').oninput=e=>{S.cc=e.target.value.replace(/\D/g,'');save()};
 $('ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(C)],{type:'application/json'}));a.download='contacts.json';a.click()};
 $('rs').onclick=()=>{if($('rs').dataset.s){U={a:[],d:[],e:{}};save();load();closeSh();buildChips();render()}else{$('rs').dataset.s=1;$('rs').textContent='اضغط مرة أخرى للتأكيد'}}}
$('gear').onclick=settings;$('add').onclick=()=>form();$('q').oninput=render;
addEventListener('keydown',e=>{if(e.key=='Escape')closeSh()});
theme();buildChips();render();
</script></body></html>
